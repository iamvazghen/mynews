<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyNews — Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="bar">
    <div class="bar__top">
      <a class="wordmark" href="./index.html">MyNews</a>
      <div class="status mono" id="status">loading…</div>
    </div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Search headlines…" aria-label="Search headlines" />
      <select class="select" id="timeframe" aria-label="Timeframe">
        <option value="0">All time</option>
        <option value="24" selected>Past 24 hours</option>
        <option value="72">Past 3 days</option>
        <option value="168">Past week</option>
        <option value="720">Past month</option>
      </select>
      <select class="select" id="sort" aria-label="Sort">
        <option value="newest" selected>Newest first</option>
        <option value="category">By category</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <p class="note" id="note" hidden></p>
  </main>

  <footer>
    MyNews · live RSS aggregation · agent API at <code>GET /api/news</code>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
